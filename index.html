<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Dashboard Cartera v2.0.4</title>

  <!-- ICONO DE LA APLICACIÓN -->
  <link rel="icon" type="image/png" href="budget.png" />
  <link rel="apple-touch-icon" href="budget.png" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <style>
    html { scroll-behavior: smooth; }
    .custom-scroll::-webkit-scrollbar { width: 4px; height: 4px; }
    .custom-scroll::-webkit-scrollbar-track { background: #0f172a; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    th.sortable { cursor: pointer; user-select: none; }
    th.sortable:hover { color: #f8fafc; background-color: rgba(30, 41, 59, 0.8); }
    
    .sticky-col-1 { position: sticky; left: 0px; z-index: 20; }
    .sticky-col-2 { position: sticky; left: 36px; z-index: 20; }
    .sticky-col-3 { position: sticky; left: 121px; z-index: 20; box-shadow: 3px 0 6px -2px rgba(0,0,0,0.5); }
    
    th.sticky-col-1 { z-index: 45 !important; }
    th.sticky-col-2 { z-index: 45 !important; }
    th.sticky-col-3 { z-index: 45 !important; }

    .bg-row-normal { background-color: #0f172a; }
    .bg-row-alt { background-color: #0b1120; }
    .bg-row-fav { background-color: rgba(120, 53, 15, 0.35) !important; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans pb-24 selection:bg-sky-500 selection:text-white relative">

  <!-- Encabezado compacto móvil -->
  <header id="top-header" class="border-b border-slate-800 bg-slate-900/95 sticky top-0 z-50 backdrop-blur-md">
    <div class="max-w-7xl mx-auto px-3 py-2 flex flex-col sm:flex-row justify-between items-center gap-2">
      <div class="flex items-center justify-between w-full sm:w-auto">
        <h1 class="text-base font-bold text-white flex items-center gap-1.5">
          📈 <span class="bg-gradient-to-r from-sky-400 to-indigo-400 bg-clip-text text-transparent">Cartera v2.0.4</span>
        </h1>
        <label class="cursor-pointer bg-slate-800 hover:bg-slate-700 text-[11px] px-2.5 py-1 rounded-lg border border-slate-700 transition">
          📂 CSV <input type="file" id="csvFileInput" accept=".csv" class="hidden" />
        </label>
      </div>
      <div class="flex items-center gap-1.5 w-full sm:w-auto">
        <input type="text" id="sheetUrlInput" placeholder="URL Google Sheets CSV..." class="bg-slate-950 border border-slate-800 text-[11px] px-2.5 py-1.5 rounded-lg text-slate-200 flex-1 sm:w-72 focus:outline-none focus:border-sky-500" />
        <button type="button" onclick="loadFromUrl()" class="bg-sky-600 hover:bg-sky-500 text-white text-[11px] px-3 py-1.5 rounded-lg font-medium transition">Cargar</button>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-2 sm:px-4 mt-3 space-y-6">

    <!-- SECCIÓN 1: TABLA PRINCIPAL DE ACCIONES -->
    <section id="sec-tabla" class="bg-slate-900 rounded-xl border border-slate-800 p-2.5 sm:p-4 space-y-3">
      
      <!-- BOTONES NAVEGACIÓN RÁPIDA -->
      <div class="flex items-center gap-1.5 overflow-x-auto custom-scroll pb-1 border-b border-slate-800/80">
        <span class="text-[10px] uppercase tracking-wider text-slate-400 font-bold whitespace-nowrap">Ir a:</span>
        <button type="button" onclick="scrollToId('sec-tabla')" class="bg-sky-950 text-sky-300 border border-sky-800/60 px-2.5 py-1 rounded-lg text-xs font-medium whitespace-nowrap flex items-center gap-1">📊 General</button>
        <button type="button" onclick="scrollToId('cajon-subidas')" class="bg-slate-950 hover:bg-slate-800 text-emerald-400 border border-slate-800 px-2.5 py-1 rounded-lg text-xs font-medium whitespace-nowrap flex items-center gap-1">🚀 Subidas</button>
        <button type="button" onclick="scrollToId('cajon-caidas')" class="bg-slate-950 hover:bg-slate-800 text-rose-400 border border-slate-800 px-2.5 py-1 rounded-lg text-xs font-medium whitespace-nowrap flex items-center gap-1">📉 Caídas</button>
        <button type="button" onclick="scrollToId('cajon-minimos')" class="bg-slate-950 hover:bg-slate-800 text-amber-400 border border-slate-800 px-2.5 py-1 rounded-lg text-xs font-medium whitespace-nowrap flex items-center gap-1">🎯 Mínimos</button>
        <button type="button" onclick="scrollToId('cajon-puts')" class="bg-slate-950 hover:bg-slate-800 text-purple-400 border border-slate-800 px-2.5 py-1 rounded-lg text-xs font-medium whitespace-nowrap flex items-center gap-1">💰 Puts</button>
      </div>

      <!-- Barra de Filtros y Búsqueda -->
      <div class="flex flex-col gap-2 pt-1">
        <div class="flex items-center gap-2">
          <input type="text" id="searchInput" placeholder="🔍 Buscar ticker o nombre..." oninput="renderTable()" class="bg-slate-950 border border-slate-800 text-xs px-3 py-2 rounded-lg text-slate-200 flex-1 focus:outline-none focus:border-sky-500" />
          <select id="carteraFilter" onchange="renderTable()" class="bg-slate-950 border border-slate-800 text-xs px-2 py-2 rounded-lg text-slate-300 focus:outline-none focus:border-sky-500 font-medium">
            <option value="all">📁 Filtrar por Cartera (Todas)</option>
          </select>
        </div>
        
        <div class="flex items-center justify-between gap-1">
          <div class="flex gap-1">
            <button type="button" onclick="setFilter('all')" id="btn-filter-all" class="filter-btn px-2.5 py-1 rounded-lg text-xs bg-sky-600 text-white font-medium">Todas</button>
            <button type="button" onclick="setFilter('highlighted')" id="btn-filter-highlighted" class="filter-btn px-2.5 py-1 rounded-lg text-xs bg-slate-800 text-slate-300">⭐ Favs</button>
            <button type="button" onclick="setFilter('puts')" id="btn-filter-puts" class="filter-btn px-2.5 py-1 rounded-lg text-xs bg-slate-800 text-slate-300">🎯 Puts</button>
          </div>
          <span id="rowCount" class="text-[10px] text-slate-400 font-mono">0 activos</span>
        </div>
      </div>

      <!-- Tabla Principal -->
      <div class="overflow-x-auto custom-scroll border border-slate-800/80 rounded-lg max-h-[60vh] overflow-y-auto relative">
        <table class="w-full text-left border-collapse min-w-[920px]">
          <thead>
            <tr class="border-b border-slate-800 text-[11px] uppercase text-slate-400 bg-slate-950 sticky top-0 z-30 shadow-md">
              <th onclick="sortTable('fav')" class="py-2.5 px-1.5 sortable text-center sticky-col-1 bg-slate-950 w-[36px]">⭐<span id="sort-fav"></span></th>
              <th onclick="sortTable('ticker')" class="py-2.5 px-2 sortable sticky-col-2 bg-slate-950 w-[85px]">Ticker<span id="sort-ticker"></span></th>
              <th onclick="sortTable('price')" class="py-2.5 px-2 text-right sortable sticky-col-3 bg-slate-950 w-[80px]">Precio<span id="sort-price"></span></th>
              <th onclick="sortTable('1D')" class="py-2.5 px-2 text-right sortable">1D<span id="sort-1D"></span></th>
              <th onclick="sortTable('pctEntrada')" class="py-2.5 px-2 text-right sortable text-sky-400">% Entr.<span id="sort-pctEntrada"></span></th>
              <th onclick="sortTable('1W')" class="py-2.5 px-2 text-right sortable">1W<span id="sort-1W"></span></th>
              <th onclick="sortTable('1M')" class="py-2.5 px-2 text-right sortable">1M<span id="sort-1M"></span></th>
              <th onclick="sortTable('YTD')" class="py-2.5 px-2 text-right sortable">YTD<span id="sort-YTD"></span></th>
              <th onclick="sortTable('1Y')" class="py-2.5 px-2 text-right sortable">1Y<span id="sort-1Y"></span></th>
              <th onclick="sortTable('pctAboveMin')" class="py-2.5 px-2 text-right sortable text-amber-400">vs Mín 52<span id="sort-pctAboveMin"></span></th>
              <th onclick="sortTable('max52')" class="py-2.5 px-2 text-right sortable">Máx 52<span id="sort-max52"></span></th>
              <th class="py-2.5 px-2 text-center">Cartera</th>
            </tr>
          </thead>
          <tbody id="tableBody" class="divide-y divide-slate-800/50 text-xs"></tbody>
        </table>
      </div>
    </section>

    <!-- SECCIÓN 2: TARJETAS CON ID PARA NAVEGACIÓN RÁPIDA -->
    <section class="space-y-4 pt-2">
      <div class="flex items-center justify-between bg-slate-900/80 p-2.5 rounded-xl border border-slate-800">
        <span class="text-xs font-semibold text-slate-300">Marco temporal tarjetas:</span>
        <div class="flex gap-1 bg-slate-950 p-1 rounded-lg border border-slate-800 text-xs">
          <button type="button" onclick="setTimeframe('1D')" id="tf-1D" class="tf-btn px-2 py-0.5 rounded text-slate-400">1D</button>
          <button type="button" onclick="setTimeframe('1W')" id="tf-1W" class="tf-btn px-2 py-0.5 rounded text-slate-400">1W</button>
          <button type="button" onclick="setTimeframe('1M')" id="tf-1M" class="tf-btn px-2 py-0.5 rounded text-slate-400">1M</button>
          <button type="button" onclick="setTimeframe('YTD')" id="tf-YTD" class="tf-btn px-2 py-0.5 rounded text-slate-400">YTD</button>
          <button type="button" onclick="setTimeframe('1Y')" id="tf-1Y" class="tf-btn px-2 py-0.5 rounded text-slate-400">1Y</button>
        </div>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
        <!-- Cajón Subidas -->
        <div id="cajon-subidas" class="bg-slate-900 border border-slate-800 rounded-xl p-3.5 scroll-mt-20">
          <h2 class="text-xs font-bold text-emerald-400 mb-2 flex justify-between items-center">
            🚀 Subidas (<span class="current-tf-label">1D</span>) <span id="count-gainers" class="bg-emerald-950/80 text-emerald-300 px-1.5 py-0.5 rounded text-[10px]">0</span>
          </h2>
          <div id="topGainersList" class="space-y-1.5 text-xs max-h-48 overflow-y-auto custom-scroll pr-1"></div>
        </div>

        <!-- Cajón Caídas -->
        <div id="cajon-caidas" class="bg-slate-900 border border-slate-800 rounded-xl p-3.5 scroll-mt-20">
          <h2 class="text-xs font-bold text-rose-400 mb-2 flex justify-between items-center">
            📉 Caídas (<span class="current-tf-label">1D</span>) <span id="count-losers" class="bg-rose-950/80 text-rose-300 px-1.5 py-0.5 rounded text-[10px]">0</span>
          </h2>
          <div id="topLosersList" class="space-y-1.5 text-xs max-h-48 overflow-y-auto custom-scroll pr-1"></div>
        </div>

        <!-- Cajón Mínimos -->
        <div id="cajon-minimos" class="bg-slate-900 border border-slate-800 rounded-xl p-3.5 scroll-mt-20">
          <h2 class="text-xs font-bold text-amber-400 mb-2 flex justify-between items-center">
            🎯 Cerca Mínimos 52S <span id="count-lows" class="bg-amber-950/80 text-amber-300 px-1.5 py-0.5 rounded text-[10px]">0</span>
          </h2>
          <div id="nearLowsList" class="space-y-1.5 text-xs max-h-48 overflow-y-auto custom-scroll pr-1"></div>
        </div>

        <!-- Cajón Puts -->
        <div id="cajon-puts" class="bg-slate-900 border border-slate-800 rounded-xl p-3.5 border-l-4 border-l-purple-500 scroll-mt-20">
          <h2 class="text-xs font-bold text-purple-400 mb-2 flex justify-between items-center">
            💰 Candidatas PUT <span id="count-puts" class="bg-purple-950/80 text-purple-300 px-1.5 py-0.5 rounded text-[10px]">0</span>
          </h2>
          <div id="putCandidatesList" class="space-y-1.5 text-xs max-h-48 overflow-y-auto custom-scroll pr-1"></div>
        </div>
      </div>
    </section>

  </main>

  <!-- Botón flotante para regresar arriba -->
  <button type="button" id="btn-scroll-top" class="fixed bottom-6 right-6 bg-sky-600 hover:bg-sky-500 active:bg-sky-700 text-white w-12 h-12 rounded-full shadow-2xl border-2 border-sky-300/40 z-[9999] flex items-center justify-center transition-all transform active:scale-95 text-lg font-bold cursor-pointer">
    ⬆️
  </button>

  <script>
    let rawData = [], currentTimeframe = '1D', currentFilter = 'all';
    let localFavs = JSON.parse(localStorage.getItem('highlightedTickers') || '[]');
    let currentSortColumn = '1D', currentSortDir = 'desc';
    const DEFAULT_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRPT5EZClEQaNvwEI1XklAQ3_oBxz1ez6ZLz3YDCHS6nlehMnMB_SyLklMjBgQBNJtqbOIEl5PUIMDF/pub?output=csv";

    document.getElementById('btn-scroll-top').addEventListener('click', function(e) {
      e.preventDefault();
      window.scrollTo({ top: 0, behavior: 'smooth' });
      document.documentElement.scrollTop = 0;
      document.body.scrollTop = 0;
    });

    function scrollToId(id) {
      const el = document.getElementById(id);
      if (el) {
        el.scrollIntoView({ behavior: 'smooth' });
      }
    }

    function normalizeRow(row) {
      const getVal = (keys) => {
        for (let k of keys) {
          const foundKey = Object.keys(row).find(rk => rk.toLowerCase().trim() === k.toLowerCase().trim());
          if (foundKey && row[foundKey] !== undefined && row[foundKey] !== null && row[foundKey] !== '') return row[foundKey];
        }
        return null;
      };
      
      const cleanNum = (val) => {
        if (!val) return 0;
        let str = val.toString().replace('%','').replace('€','').replace('$','').replace(/\s/g,'').trim();
        if (str.includes(',') && str.includes('.')) str = str.replace(/\./g, '').replace(',', '.');
        else if (str.includes(',')) str = str.replace(',', '.');
        return parseFloat(str) || 0;
      };

      const ticker = getVal(['TICKER', 'Ticker', 'Symbol']) || 'UNKNOWN';
      const nombre = getVal(['NOMBRE', 'Nombre']) || ticker;
      const price = cleanNum(getVal(['PRECIO', 'Precio']));
      const change1D = cleanNum(getVal(['HOY', '1D', '1D %']));
      const change1W = cleanNum(getVal(['1 SEMANA', '1W', '1S %']));
      const change1M = cleanNum(getVal(['1 MES', '1M', '1M %']));
      const changeYTD = cleanNum(getVal(['YTD', 'YTD %']));
      const change1Y = cleanNum(getVal(['1 AÑO', '1Y', '1A %']));
      const min52 = cleanNum(getVal(['MINIMO 52', 'Min 52']));
      const max52 = cleanNum(getVal(['MAXIMO 52', 'Max 52']));
      const entradaPrice = cleanNum(getVal(['ENTRADA', 'Precio Entrada']));
      const pctEntradaVal = cleanNum(getVal(['%ENTRADA', '% ENTRADA']));
      
      let pctEntrada = pctEntradaVal;
      if (pctEntrada === 0 && entradaPrice > 0 && price > 0) {
        pctEntrada = ((price - entradaPrice) / entradaPrice) * 100;
      }

      const favSheetVal = (getVal(['FAVORITO', 'Favorito']) || '').toString().toLowerCase().trim();
      const isFavSheet = ['si', '1', 'true', 'x', '⭐'].includes(favSheetVal);

      const carteraCat = (getVal(['CARTERA', 'Cartera']) || 'General').toString().trim();
      const pctAboveMin = (min52 > 0 && price >= min52) ? ((price - min52) / min52) * 100 : 0;

      return {
        ticker, nombre, price,
        changes: { '1D': change1D, '1W': change1W, '1M': change1M, 'YTD': changeYTD, '1Y': change1Y },
        min52, max52, entradaPrice, pctEntrada, carteraCat, isFavSheet, pctAboveMin
      };
    }

    function isFav(item) {
      return item.isFavSheet || localFavs.includes(item.ticker);
    }

    document.getElementById('csvFileInput')?.addEventListener('change', (e) => {
      if (e.target.files[0]) {
        Papa.parse(e.target.files[0], { header: true, skipEmptyLines: true, complete: (res) => processParsedData(res.data) });
      }
    });

    async function loadFromUrl() {
      let url = document.getElementById('sheetUrlInput').value.trim() || DEFAULT_URL;
      document.getElementById('sheetUrlInput').value = url;
      localStorage.setItem('savedSheetUrl', url);

      const sources = [
        url,
        "https://api.allorigins.win/raw?url=" + encodeURIComponent(url),
        "https://api.codetabs.com/v1/proxy?quest=" + encodeURIComponent(url),
        "https://corsproxy.io/?" + encodeURIComponent(url)
      ];

      let csvText = null;
      for (let src of sources) {
        try {
          let res = await fetch(src, { cache: "no-cache" });
          if (res.ok) {
            let text = await res.text();
            if (!text.trim().startsWith("<!DOCTYPE") && !text.trim().startsWith("<html") && text.length > 20) {
              csvText = text;
              break;
            }
          }
        } catch (e) {}
      }

      if (csvText) {
        Papa.parse(csvText, { header: true, skipEmptyLines: true, complete: (res) => processParsedData(res.data) });
      } else {
        alert("⚠️ No se pudieron sincronizar los datos. Usa '📂 CSV' para cargar manualmente.");
      }
    }

    function processParsedData(data) {
      rawData = data.map(normalizeRow).filter(i => i.ticker !== 'UNKNOWN' && i.price > 0);
      populateCarteraDropdown();
      renderCards();
      renderTable();
    }

    function populateCarteraDropdown() {
      const select = document.getElementById('carteraFilter');
      const categories = [...new Set(rawData.map(i => i.carteraCat))].filter(Boolean).sort();
      select.innerHTML = '<option value="all">📁 Filtrar por Cartera (Todas)</option>' + 
        categories.map(c => `<option value="${c}">${c}</option>`).join('');
    }

    function setTimeframe(tf) {
      currentTimeframe = tf;
      document.querySelectorAll('.tf-btn').forEach(b => b.classList.remove('bg-sky-600', 'text-white'));
      document.getElementById(`tf-${tf}`).classList.add('bg-sky-600', 'text-white');
      document.querySelectorAll('.current-tf-label').forEach(el => el.textContent = tf);
      renderCards();
    }

    function setFilter(filter) {
      currentFilter = filter;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('bg-sky-600', 'text-white'));
      document.getElementById(`btn-filter-${filter}`).classList.add('bg-sky-600', 'text-white');
      renderTable();
    }

    function toggleLocalFav(ticker) {
      localFavs = localFavs.includes(ticker) ? localFavs.filter(t => t !== ticker) : [...localFavs, ticker];
      localStorage.setItem('highlightedTickers', JSON.stringify(localFavs));
      renderTable();
    }

    function sortTable(col) {
      if (currentSortColumn === col) currentSortDir = currentSortDir === 'asc' ? 'desc' : 'asc';
      else { currentSortColumn = col; currentSortDir = ['ticker', 'fav'].includes(col) ? 'asc' : 'desc'; }
      renderTable();
    }

    function renderCards() {
      const g = [...rawData].filter(i => i.changes[currentTimeframe] > 0).sort((a,b) => b.changes[currentTimeframe] - a.changes[currentTimeframe]);
      document.getElementById('count-gainers').textContent = g.length;
      document.getElementById('topGainersList').innerHTML = g.map(i => `
        <div class="flex justify-between bg-slate-950/80 p-1.5 rounded border border-slate-800/60">
          <span class="font-bold text-slate-200">${i.ticker}</span>
          <span class="text-emerald-400 font-mono font-bold">+${i.changes[currentTimeframe].toFixed(2)}%</span>
        </div>`).join('') || '<span class="text-slate-500 italic">Sin datos</span>';

      const l = [...rawData].filter(i => i.changes[currentTimeframe] < 0).sort((a,b) => a.changes[currentTimeframe] - b.changes[currentTimeframe]);
      document.getElementById('count-losers').textContent = l.length;
      document.getElementById('topLosersList').innerHTML = l.map(i => `
        <div class="flex justify-between bg-slate-950/80 p-1.5 rounded border border-slate-800/60">
          <span class="font-bold text-slate-200">${i.ticker}</span>
          <span class="text-rose-400 font-mono font-bold">${i.changes[currentTimeframe].toFixed(2)}%</span>
        </div>`).join('') || '<span class="text-slate-500 italic">Sin datos</span>';

      const low = [...rawData].filter(i => i.min52 > 0).sort((a,b) => a.pctAboveMin - b.pctAboveMin);
      document.getElementById('count-lows').textContent = low.length;
      document.getElementById('nearLowsList').innerHTML = low.slice(0, 15).map(i => `
        <div class="flex justify-between bg-slate-950/80 p-1.5 rounded border border-slate-800/60">
          <span class="font-bold text-slate-200">${i.ticker}</span>
          <span class="text-amber-400 font-mono">+${i.pctAboveMin.toFixed(1)}% mín</span>
        </div>`).join('') || '<span class="text-slate-500 italic">Sin datos</span>';

      const p = [...rawData].filter(i => i.changes['1D'] <= -3.0 && i.min52 > 0 && i.pctAboveMin <= 5.0)
                            .sort((a,b) => a.pctAboveMin - b.pctAboveMin);
      document.getElementById('count-puts').textContent = p.length;
      document.getElementById('putCandidatesList').innerHTML = p.map(i => `
        <div class="flex justify-between bg-slate-950/80 p-1.5 rounded border border-purple-900/40">
          <span class="font-bold text-purple-300">${i.ticker}</span>
          <span class="text-rose-400 font-mono">${i.changes['1D'].toFixed(1)}% | <span class="text-amber-400">+${i.pctAboveMin.toFixed(1)}% mín</span></span>
        </div>`).join('') || '<span class="text-slate-500 italic">Ninguna cumple el criterio</span>';
    }

    function renderTable() {
      const search = document.getElementById('searchInput').value.toLowerCase();
      const carteraSel = document.getElementById('carteraFilter').value;

      ['fav', 'ticker', 'price', '1D', 'pctEntrada', '1W', '1M', 'YTD', '1Y', 'pctAboveMin', 'max52'].forEach(col => {
        const span = document.getElementById(`sort-${col}`);
        if (span) span.textContent = currentSortColumn === col ? (currentSortDir === 'asc' ? '▲' : '▼') : '';
      });

      let filtered = rawData.filter(i => {
        const matchesSearch = i.ticker.toLowerCase().includes(search) || i.nombre.toLowerCase().includes(search);
        const matchesCartera = carteraSel === 'all' || i.carteraCat === carteraSel;
        const matchesTabFilter = currentFilter === 'all' || 
          (currentFilter === 'highlighted' && isFav(i)) || 
          (currentFilter === 'puts' && i.changes['1D'] <= -3.0 && i.pctAboveMin <= 5.0);
        return matchesSearch && matchesCartera && matchesTabFilter;
      });

      filtered.sort((a, b) => {
        let valA, valB;
        if (currentSortColumn === 'fav') { valA = isFav(a)?1:0; valB = isFav(b)?1:0; }
        else if (currentSortColumn === 'ticker') { valA = a.ticker; valB = b.ticker; }
        else if (currentSortColumn === 'price') { valA = a.price; valB = b.price; }
        else if (['1D','1W','1M','YTD','1Y'].includes(currentSortColumn)) { valA = a.changes[currentSortColumn]; valB = b.changes[currentSortColumn]; }
        else if (currentSortColumn === 'pctEntrada') { valA = a.pctEntrada; valB = b.pctEntrada; }
        else if (currentSortColumn === 'pctAboveMin') { valA = a.pctAboveMin; valB = b.pctAboveMin; }
        else if (currentSortColumn === 'max52') { valA = a.max52; valB = b.max52; }

        return typeof valA === 'string' ? 
          (currentSortDir === 'asc' ? valA.localeCompare(valB) : valB.localeCompare(valA)) : 
          (currentSortDir === 'asc' ? valA - valB : valB - valA);
      });

      document.getElementById('rowCount').textContent = `${filtered.length} activos`;

      const pill = (v) => `<span class="font-mono font-bold ${v>=0?'text-emerald-400':'text-rose-400'}">${v>=0?'+':''}${v.toFixed(2)}%</span>`;

      document.getElementById('tableBody').innerHTML = filtered.map((i, idx) => {
        const favorite = isFav(i);
        const rowBgClass = favorite ? 'bg-row-fav' : (idx % 2 === 0 ? 'bg-row-normal' : 'bg-row-alt');
        const stickyBgClass = favorite ? 'bg-amber-950/90' : 'bg-slate-950';

        return `
        <tr class="${rowBgClass} hover:bg-slate-800/80 border-b border-slate-800/40 transition-colors">
          <td class="py-2 px-1.5 text-center sticky-col-1 ${stickyBgClass}">
            <button type="button" onclick="toggleLocalFav('${i.ticker}')" class="text-sm focus:outline-none">
              ${favorite ? '⭐' : '☆'}
            </button>
          </td>

          <td class="py-2 px-2 sticky-col-2 ${stickyBgClass}">
            <span class="font-bold block ${favorite ? 'text-amber-300' : 'text-slate-100'}">${i.ticker}</span>
            <span class="text-[9px] text-slate-400 block truncate max-w-[75px]">${i.nombre}</span>
          </td>

          <td class="py-2 px-2 text-right font-mono font-semibold sticky-col-3 ${stickyBgClass} text-slate-200">
            ${i.price.toFixed(2)}
          </td>

          <td class="py-2 px-2 text-right">${pill(i.changes['1D'])}</td>
          <td class="py-2 px-2 text-right">${pill(i.pctEntrada)}</td>
          <td class="py-2 px-2 text-right">${pill(i.changes['1W'])}</td>
          <td class="py-2 px-2 text-right">${pill(i.changes['1M'])}</td>
          <td class="py-2 px-2 text-right">${pill(i.changes['YTD'])}</td>
          <td class="py-2 px-2 text-right">${pill(i.changes['1Y'])}</td>
          <td class="py-2 px-2 text-right font-mono text-xs text-amber-300">+${i.pctAboveMin.toFixed(1)}%</td>
          <td class="py-2 px-2 text-right text-slate-400 font-mono text-xs">${i.max52 ? i.max52.toFixed(2) : '-'}</td>
          <td class="py-2 px-2 text-center">
            <span class="bg-slate-800 text-slate-300 text-[10px] px-2 py-0.5 rounded border border-slate-700">${i.carteraCat}</span>
          </td>
        </tr>
      `}).join('');
    }

    window.addEventListener('DOMContentLoaded', () => {
      document.getElementById('sheetUrlInput').value = localStorage.getItem('savedSheetUrl') || DEFAULT_URL;
      loadFromUrl();
    });

    setTimeframe('1D');
  </script>
</body>
</html>
